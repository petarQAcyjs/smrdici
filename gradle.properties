# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# Enable Gradle configuration cache - značajno ubrzava build vreme
org.gradle.configuration-cache=true
# Enable File System watching - smanjuje I/O operacije i ubrzava build
org.gradle.vfs.watch=true
# Koristi daemon za pokretanje build procesa što ubrzava build
org.gradle.daemon=true
# Koristi compile avoidance pri izgradnji projekta
org.gradle.unsafe.configuration-cache-problems=warn
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# Dodajemo ovo da potisnemo upozorenje za compileSdk 36
android.suppressUnsupportedCompileSdk=36
versionName=1.0
versionCode=1

# Isključujemo JVM toolchain validaciju jer imamo problem sa pronalaženjem Java instalacije
org.gradle.toolchains.foojay-resolver-convention.enabled=false
kotlin.jvm.target.validation.mode=ignore

org.gradle.java.installations.auto-download=true

# Java home paths for different operating systems
# The appropriate path will be set in build.gradle.kts based on the operating system
# Windows path: C:/Program Files/Android/Android Studio/jbr
# macOS path: /Applications/Android Studio.app/Contents/jbr/Contents/Home

# Remove explicit Java home setting from here as it will be handled in build.gradle.kts
# org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home